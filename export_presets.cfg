[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,data/en/*.json,data/th/*.json,scripts/net/google_web.js,config/public.cfg"
exclude_filter="config/secrets.cfg,config/secrets.example.cfg,server/*,tests/*,docs/*"
export_path=""

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
