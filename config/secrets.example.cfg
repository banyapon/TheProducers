; Copy to config/secrets.cfg (gitignored) and fill in your own keys.
; A copy at user://secrets.cfg takes precedence (handy for exported builds).

[firebase]
api_key=""
project_id=""
auth_domain=""

[cloudinary]
; cloudinary://<api_key>:<api_secret>@<cloud_name>
url=""
; "local"  = the game computes the upload signature itself (DEV ONLY: the api_secret ships inside the build)
; "server" = the game asks server/functions (Firebase Cloud Function) to sign, authenticated with the player's ID token
signing_mode="local"
signing_url=""
root_folder="the_producers"

[music]
; "local"       = built-in procedural synth (free, offline, always works)
; "huggingface" = MusicGen through the Hugging Face Inference API (free tier, needs a token; falls back to local on error)
provider="local"
hf_token=""
hf_model_url="https://router.huggingface.co/hf-inference/models/facebook/musicgen-small"


; Optional Google Desktop OAuth client (same Google Cloud / Firebase project).
; Enable Google in Firebase Authentication and allow this client ID.
[google]
client_id=""
client_secret=""
; Separate Web application OAuth ID. Never use the Desktop ID on a website.
web_client_id=""
